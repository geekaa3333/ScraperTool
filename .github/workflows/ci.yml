name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:fast

      - name: Verify secrets are configured (optional)
        run: |
          if [ -z "${{ secrets.SERPAPI_API_KEY }}" ]; then
            echo "::warning::SERPAPI_API_KEY secret is not set. SerpApi-backed features will be disabled."
          else
            echo "SERPAPI_API_KEY is configured."
          fi
